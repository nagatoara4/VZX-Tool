services:
  commerce-os:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      COMMERCE_DB_PATH: /data/commerce.db
      EXECUTION_MODE: simulation
    volumes:
      - commerce_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  commerce_data:
